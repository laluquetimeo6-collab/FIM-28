<style>
  :root {
    --bg: #0B0D12;
    --panel: #12151C;
    --panel-alt: #171B24;
    --border: rgba(217,167,104,0.18);
    --border-strong: rgba(217,167,104,0.35);
    --gold: #D9A768;
    --gold-bright: #ECC98F;
    --text: #E7E2D6;
    --text-soft: #948C7C;
    --green: #57C278;
    --green-bg: rgba(87,194,120,0.12);
    --red: #E38C7C;
    --red-bg: rgba(217,107,90,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(217,167,104,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,167,104,0.045) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 40px 16px 64px;
    line-height: 1.55;
  }

  button, input, textarea, select { font: inherit; color: inherit; }

  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar { position: relative; height: 38px; margin-bottom: 4px; }
  .menu-btn { position: absolute; top: 0; left: 0; background: var(--panel-alt); border: 1px solid var(--border); color: var(--gold-bright); width: 38px; height: 38px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .menu-btn:hover { background: rgba(217,167,104,0.1); }
  .menu-dropdown { position: absolute; top: 44px; left: 0; background: var(--panel-alt); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px; z-index: 10; min-width: 210px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .menu-dropdown button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 0.88rem; }
  .menu-dropdown button:hover { background: rgba(217,167,104,0.1); }
  .menu-dropdown button.active { color: var(--gold-bright); font-weight: 600; }
  .menu-divider { border-top: 1px solid var(--border); margin: 6px 4px; }

  .letterhead { text-align: center; margin-bottom: 22px; }
  .seal { width: 92px; height: 92px; display: block; margin: 0 auto 14px; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6)); }
  .letterhead h1 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.5rem; color: var(--gold-bright); margin: 0 0 6px; }
  .letterhead .dept { font-size: 0.85rem; color: var(--gold); opacity: 0.8; margin: 0; letter-spacing: 0.1em; }

  .identity-row { display: flex; justify-content: space-between; align-items: center; margin: 0 0 18px; flex-wrap: wrap; gap: 8px; }
  .identity-row .who { font-size: 0.82rem; color: var(--text-soft); }
  .identity-row .who strong { color: var(--gold-bright); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 28px 24px 32px; }

  .section-title { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1rem; color: var(--gold-bright); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin: 0 0 20px; }
  .subsection-title { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--gold-bright); margin: 24px 0 4px; }

  .landing { text-align: center; padding: 10px 0 6px; }
  .landing .tagline { color: var(--text-soft); margin: 0 0 26px; font-size: 0.95rem; }
  .btn-discord { display: inline-flex; align-items: center; gap: 10px; background: var(--gold); color: #1B1206; border: none; padding: 14px 28px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
  .btn-discord:hover { background: var(--gold-bright); }
  .btn-discord svg { width: 18px; height: 18px; }
  .setup-warning { background: var(--red-bg); border: 1px solid rgba(227,140,124,0.4); border-radius: 6px; padding: 14px 16px; font-size: 0.85rem; color: var(--red); text-align: left; }
  .setup-warning code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 3px; }

  .tag { display: inline-block; padding: 4px 10px 4px 12px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; border-radius: 2px; clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); }
  .tag-unit { background: rgba(217,167,104,0.14); color: var(--gold-bright); border: 1px solid var(--border-strong); }
  .tag-attente { background: rgba(217,167,104,0.14); color: var(--gold-bright); border: 1px solid var(--border-strong); }
  .tag-admis { background: var(--green-bg); color: var(--green); border: 1px solid rgba(87,194,120,0.4); }
  .tag-refuse { background: var(--red-bg); color: var(--red); border: 1px solid rgba(227,140,124,0.4); }
  .tag-open { background: var(--green-bg); color: var(--green); border: 1px solid rgba(87,194,120,0.4); }
  .tag-closed { background: rgba(148,140,124,0.12); color: var(--text-soft); border: 1px solid rgba(148,140,124,0.3); }

  /* ---------- Firestore ---------- */

  async function loadApplications() {
    try {
      const snap = await getDocs(collection(db, "applications"));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.error("Erreur Firestore (candidatures)", e);
      lastFirestoreError = describeError(e);
      state.loadError = "Impossible de charger les candidatures (" + lastFirestoreError + ").";
      return [];

  /* ---------- Discord OAuth ---------- */

  function parseDiscordToken() {
    if (window.location.hash && window.location.hash.indexOf("access_token") !== -1) {
      const params = new URLSearchParams(window.location.hash.substring(1));
      const token = params.get("access_token");
      if (token) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
        return token;
      }
    }
    return null;
  }

  async function fetchDiscordUser(token) {
    const res = await fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + token } });
    if (!res.ok) throw new Error("auth failed");
    return res.json();
  }

  function handleDiscordLogin() {
    if (!isDiscordConfigured()) return;
    const redirectUri = window.location.origin;
    const params = new URLSearchParams({
      client_id: DISCORD_CLIENT_ID,
      redirect_uri: redirectUri,
      response_type: "token",
      scope: "identify",
    });
    window.location.href = "https://discord.com/api/oauth2/authorize?" + params.toString();
  }

  function renderTopbar() {
    return `
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        ${state.menuOpen ? `
          <div class="menu-dropdown">
            <button class="menuItem ${state.view === "candidat" ? "active" : ""}" data-view="candidat">Recrutement</button>
            <button class="menuItem ${(state.view === "codexList" || state.view === "codexView") ? "active" : ""}" data-view="codexList">Codex</button>
            ${state.role ? `
              <div class="menu-divider"></div>
              <button class="menuItem ${state.view === "staff" ? "active" : ""}" data-view="staff">Registre (Staff)</button>
              <button class="menuItem ${state.view === "resultats" ? "active" : ""}" data-view="resultats">Résultats</button>
              <button class="menuItem ${state.view === "staffBoard" ? "active" : ""}" data-view="staffBoard">Espace Staff</button>
            ` : ""}
            ${state.role === "admin" ? `
              <button class="menuItem ${(state.view === "gestion" || state.view === "editUnit") ? "active" : ""}" data-view="gestion">Gestion des postes</button>
              <button class="menuItem ${(state.view === "gestionCodex" || state.view === "editCodex") ? "active" : ""}" data-view="gestionCodex">Gestion du Codex</button>
              <button class="menuItem ${state.view === "gestionStaff" ? "active" : ""}" data-view="gestionStaff">Gestion du staff</button>
            ` : ""}
          </div>
        ` : ""}
      </div>
    `;
  }

  function renderLanding() {
    if (!isDiscordConfigured()) {
      return `
        <div class="landing">
          <p class="tagline">Plateforme de recrutement — accès réservé aux opérateurs accrédités.</p>
          <div class="setup-warning"><strong>Configuration requise :</strong> ajoute ton Client ID Discord dans le code (constante <code>DISCORD_CLIENT_ID</code>) pour activer la connexion.</div>
        </div>
      `;
    }
    return `
      <div class="landing">
        <p class="tagline">Plateforme de recrutement — accès réservé aux opérateurs accrédités.</p>
        <button class="btn-discord" id="discordLoginBtn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 4h16v12H7l-3 3V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Se connecter via Discord
        </button>
        ${state.authError ? `<p class="error">${esc(state.authError)}</p>` : ""}
      </div>
    `;
  }

  function renderCandidat() {
    if (state.loading) return `<p>Chargement…</p>`;
    const mine = state.applications.filter(a => a.discordId === state.discordUser.id).slice().reverse();
    const refusals = mine.filter(a => a.status === "refuse").length;
    const blocked = refusals >= 3;
    return `
      <h2 class="section-title">Mes candidatures</h2>
      ${mine.length === 0 ? `<p class="empty">Tu n'as pas encore de candidature.</p>` : mine.map(renderMyApplicationRow).join("")}
      ${blocked ? `<p class="load-error" style="margin-top:16px;">Tu as été refusé(e) ${refusals} fois : tu ne peux plus soumettre de nouvelle candidature. Contacte le staff si tu penses que c'est une erreur.</p>` : ""}
      <h2 class="section-title" style="margin-top:30px;">Postes ouverts</h2>
      ${state.units.length === 0 ? `<p class="empty">Aucun poste disponible pour le moment.</p>` : state.units.map(u => renderUnitCard(u, blocked)).join("")}
    `;
  }

  function renderMyApplicationRow(a) {
    const unit = state.units.find(u => u.id === a.unitId);
    return `
      <div class="my-app-row">
        <span class="tag tag-unit">${esc(unit ? unit.code : "?")}</span>
        <span class="tag tag-${a.status}">${statusLabel(a.status)}</span>
        <span class="date">${new Date(a.submittedAt).toLocaleDateString("fr-FR")}</span>
      </div>
    `;
  }

  function renderUnitCard(u, blocked) {
    const already = hasActiveApplication(u.id);
    return `
      <div class="unit-card">
        <div class="unit-head">
          <span class="tag tag-unit">${esc(u.code)}</span>
          <span class="tag ${u.open ? "tag-open" : "tag-closed"}">${u.open ? "OUVERT" : "FERMÉ"}</span>
        </div>
        <h3>${esc(u.name)}</h3>
        <p>${esc(u.description)}</p>
        ${!u.open ? `<p class="already">Recrutement fermé</p>` : blocked ? `<p class="already">Candidatures bloquées (3 refus)</p>` : already ? `<p class="already">Candidature déjà envoyée</p>` : `<button class="btn-primary applyBtn" data-unit="${u.id}">Candidater</button>`}
      </div>
    `;
  }

  function renderApplyForm() {
    const unit = state.units.find(u => u.id === state.applyUnitId);
    if (!unit) { state.view = "candidat"; return renderCandidat(); }
    return `
      <button class="btn-link" id="backBtn">← Retour</button>

  /* ---------- handlers ---------- */

  function syncDraftFromForm() {
    const form = document.getElementById("unitForm");
    if (!form || !state.unitDraft) return;
    state.unitDraft.code = form.code.value;
    state.unitDraft.name = form.name.value;
    state.unitDraft.description = form.description.value;
    const openBox = document.getElementById("u_open");
    if (openBox) state.unitDraft.open = openBox.checked;
    const webhookBox = document.getElementById("u_webhook");
    if (webhookBox) state.unitDraft.webhookUrl = webhookBox.value;
    document.querySelectorAll(".q-label").forEach(inp => {
      const idx = Number(inp.dataset.idx);
      if (state.unitDraft.questions[idx]) state.unitDraft.questions[idx].label = inp.value;
    });
    document.querySelectorAll(".q-type").forEach(sel => {
      const idx = Number(sel.dataset.idx);
      if (state.unitDraft.questions[idx]) state.unitDraft.questions[idx].type = sel.value;
    });
  }

  function attachHandlers() {
    const menuBtn = document.getElementById("menuBtn");
    if (menuBtn) menuBtn.addEventListener("click", () => { state.menuOpen = !state.menuOpen; render(); });
    document.querySelectorAll(".menuItem").forEach(btn => {
      btn.addEventListener("click", () => { state.view = btn.dataset.view; state.menuOpen = false; render(); });
    });

    const loginBtn = document.getElementById("discordLoginBtn");
    if (loginBtn) loginBtn.addEventListener("click", handleDiscordLogin);

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.addEventListener("click", () => { state.discordUser = null; state.role = null; state.view = "landing"; render(); });

    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", () => { state.view = "candidat"; state.applyUnitId = null; render(); });

    document.querySelectorAll(".applyBtn").forEach(btn => {
      btn.addEventListener("click", () => { state.applyUnitId = btn.dataset.unit; state.view = "apply"; render(); });
    });

    const appForm = document.getElementById("appForm");
    if (appForm) appForm.addEventListener("submit", handleSubmitApplication);

    const staffBoardForm = document.getElementById("staffBoardForm");
    if (staffBoardForm) staffBoardForm.addEventListener("submit", handleSaveStaffBoard);

    const staffForm = document.getElementById("staffForm");
    if (staffForm) staffForm.addEventListener("submit", handleAddStaff);
    document.querySelectorAll(".removeStaffBtn").forEach(btn => {
      btn.addEventListener("click", e => handleRemoveStaff(e.target.dataset.id));
    });

    document.querySelectorAll(".statusSelect").forEach(sel => {
      sel.addEventListener("change", e => handleStatusChange(e.target.dataset.id, e.target.value));
    });
    document.querySelectorAll(".saveNotesBtn").forEach(btn => {
      btn.addEventListener("click", e => handleSaveNotes(e.target.dataset.id));
    });
    document.querySelectorAll(".deleteAppBtn").forEach(btn => {
      btn.addEventListener("click", e => handleDeleteApplication(e.target.dataset.id));
    });
    document.querySelectorAll(".notifyBtn").forEach(btn => {
      btn.addEventListener("click", e => handleNotify(e.target.dataset.id));
    });

    const newUnitBtn = document.getElementById("newUnitBtn");
    if (newUnitBtn) newUnitBtn.addEventListener("click", () => {
      state.editingUnitId = null;
      state.unitDraft = {
        code: "", name: "", description: "", open: true, webhookUrl: "",
        questions: [
          { id: newId(), label: "Expérience RP / SCP", type: "textarea" },
          { id: newId(), label: "Motivation", type: "textarea" },
          { id: newId(), label: "Disponibilités", type: "text" },
        ],
      };
      state.view = "editUnit";
      render();
    });
    document.querySelectorAll(".editUnitBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const unit = state.units.find(u => u.id === btn.dataset.id);
        if (!unit) return;
        state.editingUnitId = unit.id;
        state.unitDraft = {
          code: unit.code || "", name: unit.name || "", description: unit.description || "", open: !!unit.open, webhookUrl: unit.webhookUrl || "",
          questions: (unit.questions || []).map(q => ({ id: q.id, label: q.label, type: q.type })),
        };
        state.view = "editUnit";
        render();
      });
    });
    const cancelEditUnitBtn = document.getElementById("cancelEditUnitBtn");
    if (cancelEditUnitBtn) cancelEditUnitBtn.addEventListener("click", () => { state.view = "gestion"; state.unitDraft = null; state.editingUnitId = null; render(); });

    const addQuestionBtn = document.getElementById("addQuestionBtn");
    if (addQuestionBtn) addQuestionBtn.addEventListener("click", () => {
      syncDraftFromForm();
      state.unitDraft.questions.push({ id: newId(), label: "", type: "text" });
      render();
    });
    document.querySelectorAll(".removeQuestionBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        syncDraftFromForm();
        const idx = Number(btn.dataset.idx);
        state.unitDraft.questions.splice(idx, 1);
        render();
      });
    });

    const unitForm = document.getElementById("unitForm");
    if (unitForm) unitForm.addEventListener("submit", handleSaveUnit);
    const deleteUnitBtn = document.getElementById("deleteUnitBtn");
    if (deleteUnitBtn) deleteUnitBtn.addEventListener("click", handleDeleteUnit);

    document.querySelectorAll(".resultsTabBtn").forEach(btn => {
      btn.addEventListener("click", () => { state.resultsTab = btn.dataset.tab; render(); });
    });
    document.querySelectorAll(".saveResultBtn").forEach(btn => {
      btn.addEventListener("click", e => handleSaveResult(e.target.dataset.id));
    });
    document.querySelectorAll(".deleteResultBtn").forEach(btn => {
      btn.addEventListener("click", e => handleDeleteResult(e.target.dataset.id));
    });

    document.querySelectorAll(".viewCodexBtn").forEach(btn => {
      btn.addEventListener("click", () => { state.viewingCodexId = btn.dataset.id; state.view = "codexView"; render(); });
    });
    const backCodexBtn = document.getElementById("backCodexBtn");
    if (backCodexBtn) backCodexBtn.addEventListener("click", () => { state.view = "codexList"; state.viewingCodexId = null; render(); });

    const newCodexBtn = document.getElementById("newCodexBtn");
    if (newCodexBtn) newCodexBtn.addEventListener("click", () => {
      state.editingCodexId = null;
      state.codexDraft = { title: "", content: "" };
      state.view = "editCodex";
      render();
    });
    document.querySelectorAll(".editCodexBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const c = state.codices.find(x => x.id === btn.dataset.id);
        if (!c) return;
        state.editingCodexId = c.id;
        state.codexDraft = { title: c.title || "", content: c.content || "" };
        state.view = "editCodex";
        render();
      });
    });
    const cancelEditCodexBtn = document.getElementById("cancelEditCodexBtn");
    if (cancelEditCodexBtn) cancelEditCodexBtn.addEventListener("click", () => { state.view = "gestionCodex"; state.codexDraft = null; state.editingCodexId = null; render(); });
    const codexForm = document.getElementById("codexForm");
    if (codexForm) codexForm.addEventListener("submit", handleSaveCodex);
    const deleteCodexBtn = document.getElementById("deleteCodexBtn");
    if (deleteCodexBtn) deleteCodexBtn.addEventListener("click", handleDeleteCodex);
  }

  async function handleSubmitApplication(e) {
    e.preventDefault();
    const refusals = state.applications.filter(a => a.discordId === state.discordUser.id && a.status === "refuse").length;
    if (refusals >= 3) {
      alert("Tu as été refusé(e) 3 fois : tu ne peux plus soumettre de candidature.");
      state.view = "candidat";
      render();
      return;
    }
    const form = e.target;
    const responses = {};
    document.querySelectorAll(".customQuestion").forEach(el => {
      responses[el.dataset.qid] = el.value.trim();
    });
    const newApp = {
      unitId: state.applyUnitId,
      discordId: state.discordUser.id,
      discordUsername: state.discordUser.display,
      pseudoRoblox: form.pseudoRoblox.value.trim(),
      age: form.age.value,
      responses,
      status: "attente",
      notes: "",
      submittedAt: new Date().toISOString(),
    };
    const ok = await addApplication(newApp);
    if (!ok) {
      alert("Impossible d’enregistrer la candidature (" + (lastFirestoreError || "erreur inconnue") + "). Vérifie ta connexion et les règles Firestore.");
      return;
    }
    state.applications = await loadApplications();
    state.view = "candidat";
    state.applyUnitId = null;
    render();
  }

  async function handleAddStaff(e) {
    e.preventDefault();
    const idInput = document.getElementById("s_id");
    const labelInput = document.getElementById("s_label");
    const roleSelect = document.getElementById("s_role");
    const discordId = idInput.value.trim();
    if (!/^\d{15,25}$/.test(discordId)) {
      alert("L'ID Discord doit être une suite de chiffres (clic droit sur le profil → Copier l'ID de l'utilisateur, mode développeur activé dans Discord).");
      return;
    }
    const ok = await setStaffMember(discordId, roleSelect.value, labelInput.value.trim());
    if (!ok) {
      alert("Impossible d'enregistrer (" + (lastFirestoreError || "erreur inconnue") + ").");
      return;
    }
    state.staffList = await loadStaff();
    render();
  }

  async function handleRemoveStaff(discordId) {
    if (!confirm("Retirer ce membre du staff ?")) return;
    const ok = await removeStaffMember(discordId);
    if (!ok) {
      alert("Impossible de retirer (" + (lastFirestoreError || "erreur inconnue") + ").");
      return;
    }
    state.staffList = await loadStaff();
    render();
  }

  async function handleSaveStaffBoard(e) {
    e.preventDefault();
    const textarea = document.getElementById("staffBoardContent");
    if (!textarea) return;
    const content = textarea.value;
    state.staffBoardSaving = true;
    render();
    const ok = await saveStaffBoard(content);
    state.staffBoardSaving = false;
    if (!ok) {
      alert("Impossible d’enregistrer l’espace staff (" + (lastFirestoreError || "erreur inconnue") + ").");
      render();
      return;
    }
    state.staffBoard = content;
    render();
  }

  async function handleDeleteApplication(id) {
    const app = state.applications.find(a => a.id === id);
    const label = app ? (app.pseudoRoblox + " (@" + app.discordUsername + ")") : "cette candidature";
    if (!confirm("Supprimer définitivement la candidature de " + label + " ? Cette action est irréversible.")) return;
    const btn = document.querySelector(`.deleteAppBtn[data-id="${id}"]`);
    if (btn) { btn.disabled = true; btn.textContent = "Suppression…"; }
    const ok = await deleteApplicationDoc(id);
    if (!ok) {
      if (btn) { btn.disabled = false; btn.textContent = "✗ Échec (" + (lastFirestoreError || "?") + ")"; }
      return;
    }
    state.applications = state.applications.filter(a => a.id !== id);
    render();
  }

  async function handleStatusChange(id, status) {
    await updateApplicationDoc(id, { status });
    state.applications = await loadApplications();
    render();
  }

  async function handleSaveNotes(id) {
    const btn = document.querySelector(`.saveNotesBtn[data-id="${id}"]`);
    const textarea = document.querySelector(`.notesInput[data-id="${id}"]`);
    if (!textarea) return;
    const notes = textarea.value.trim();
    if (btn) { btn.disabled = true; btn.textContent = "Enregistrement…"; }
    const ok = await updateApplicationDoc(id, { notes });
    if (!ok) {
      if (btn) { btn.disabled = false; btn.textContent = "✗ Échec (" + (lastFirestoreError || "?") + ") — réessayer"; }
      return;
    }
    state.applications = await loadApplications();
    render();
  }

  async function handleNotify(id) {
    const target = state.applications.find(a => a.id === id);
    if (!target) return;
    const statusEl = document.querySelector(`.notify-status[data-id="${id}"]`);
    const unit = state.units.find(u => u.id === target.unitId);
    if (!unit || !unit.webhookUrl) {
      if (statusEl) statusEl.textContent = "Aucun webhook configuré pour cette unité (Gestion des postes)";
      return;
    }
    const textarea = document.querySelector(`.notifyMsgInput[data-id="${id}"]`);
    const content = textarea ? textarea.value.trim() : defaultNotifyMessage(target, unit);
    if (!content) {
      if (statusEl) statusEl.textContent = "Le message ne peut pas être vide";
      return;
    }
    if (statusEl) statusEl.textContent = "Envoi…";
    try {
      const res = await fetch(unit.webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      });
      if (res.ok) {
        if (statusEl) statusEl.textContent = "✓ Envoyé au salon";
        await addResultDoc({
          unitId: target.unitId,
          applicationId: target.id,
          discordUsername: target.discordUsername,
          pseudoRoblox: target.pseudoRoblox,
          status: target.status,
          message: content,
          sentAt: new Date().toISOString(),
        });
        state.results = await loadResults();
      } else {
        if (statusEl) statusEl.textContent = "✗ Échec (" + res.status + ")";
      }
    } catch (err) {
      if (statusEl) statusEl.textContent = "✗ Échec réseau";
    }
  }

  async function handleSaveUnit(e) {
    e.preventDefault();
    syncDraftFromForm();
    const data = {
      code: state.unitDraft.code.trim(),
      name: state.unitDraft.name.trim(),
      description: state.unitDraft.description.trim(),
      open: state.unitDraft.open,
      webhookUrl: state.unitDraft.webhookUrl.trim(),
      questions: state.unitDraft.questions.filter(q => q.label.trim() !== ""),
    };
    if (!data.code || !data.name) {
      alert("Le code et le nom du poste sont obligatoires.");
      return;
    }
    if (data.webhookUrl && !/^https:\/\/discord(?:app)?\.com\/api\/webhooks\//i.test(data.webhookUrl)) {
      alert("Le webhook doit être une URL Discord valide.");
      return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Enregistrement…"; }
    const ok = state.editingUnitId
      ? await updateUnitDoc(state.editingUnitId, data)
      : await addUnit(data);
    if (!ok) {
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = "✗ Échec (" + (lastFirestoreError || "?") + ") — réessayer"; }
      return;
    }
    state.units = await loadUnits();
    state.view = "gestion";
    state.editingUnitId = null;
    state.unitDraft = null;
    render();
  }

  async function handleDeleteUnit() {
    if (!state.editingUnitId) return;
    await deleteUnitDoc(state.editingUnitId);
    state.units = await loadUnits();
    state.view = "gestion";
    state.editingUnitId = null;
    state.unitDraft = null;
    render();
  }

  async function handleSaveResult(id) {
    const btn = document.querySelector(`.saveResultBtn[data-id="${id}"]`);
    const textarea = document.querySelector(`.resultMsgInput[data-id="${id}"]`);
    const statusEl = document.querySelector(`.result-status[data-id="${id}"]`);
    if (!textarea) return;
    const message = textarea.value.trim();
    if (btn) { btn.disabled = true; btn.textContent = "Enregistrement…"; }
    const ok = await updateResultDoc(id, { message });
    if (!ok) {
      if (statusEl) statusEl.textContent = "✗ Échec (" + (lastFirestoreError || "?") + ")";
      if (btn) { btn.disabled = false; btn.textContent = "Enregistrer"; }
      return;
    }
    state.results = await loadResults();
    render();
  }

  async function handleDeleteResult(id) {
    const r = state.results.find(x => x.id === id);
    const label = r ? (r.pseudoRoblox + " (@" + r.discordUsername + ")") : "ce résultat";
    if (!confirm("Supprimer définitivement le résultat de " + label + " ? Cette action est irréversible.")) return;
    const btn = document.querySelector(`.deleteResultBtn[data-id="${id}"]`);
    if (btn) { btn.disabled = true; btn.textContent = "Suppression…"; }
    const ok = await deleteResultDoc(id);
    if (!ok) {
      if (btn) { btn.disabled = false; btn.textContent = "✗ Échec"; }
      return;
    }
    state.results = state.results.filter(x => x.id !== id);
    render();
  }

  async function handleSaveCodex(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
      title: form.title.value.trim(),
      content: form.content.value.trim(),
    };
    if (!data.title) {
      alert("Le titre du codex est obligatoire.");
      form.title.focus();
      return;
    }
    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Enregistrement…"; }
    const ok = state.editingCodexId
      ? await updateCodexDoc(state.editingCodexId, data)
      : await addCodex(data);
    if (!ok) {
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = "✗ Échec (" + (lastFirestoreError || "?") + ") — réessayer"; }
      return;
    }
    state.codices = await loadCodices();
    state.view = "gestionCodex";
    state.editingCodexId = null;
    state.codexDraft = null;
    render();
  }

  async function handleDeleteCodex() {
    if (!state.editingCodexId) return;
    await deleteCodexDoc(state.editingCodexId);
    state.codices = await loadCodices();
    state.view = "gestionCodex";
    state.editingCodexId = null;
    state.codexDraft = null;
    render();
  }

  /* ---------- init ---------- */

  async function init() {
    const token = parseDiscordToken();
    if (token) {
      try {
        const user = await fetchDiscordUser(token);
        state.discordUser = { id: user.id, username: user.username, display: user.global_name || user.username };
      } catch (e) {
        state.authError = "La connexion Discord a échoué. Réessaie.";
      }
    }
    if (state.discordUser) {
      state.loading = true;
      state.view = "candidat";
      render();
      state.staffList = await loadStaff();
      state.role = getRole(state.discordUser.id);
      state.view = state.role ? "staff" : "candidat";
      state.applications = await loadApplications();
      state.units = await loadUnits();
      state.codices = await loadCodices();
      if (state.role) {
        state.results = await loadResults();
        state.staffBoard = await loadStaffBoard();
      }
      state.loading = false;
      render();
    } else {
      state.view = "landing";
      render();
    }
  }

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
